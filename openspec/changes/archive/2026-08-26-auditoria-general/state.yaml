reconciliation:
  performed_by: orchestrator
  after: spec and design ran in parallel
  findings:
    - id: R1
      topic: session revocation inside the transaction
      divergence: >-
        design.md's Data Flow puts repos.sesiones.deleteOthers inside the
        transaction and rolls it back with everything else. The spec's
        password-change delta covered only the password write, the flag and the
        audit row.
      resolution: >-
        DESIGN WINS; spec updated. The capability already promises that another
        session's cookie stops working, and that promise is not kept if the
        revocation can fail on its own while the password change commits — the
        user would be told they are protected when they are not. This also closes
        a PRE-EXISTING gap: service.ts:129-130 performs updatePassword and
        deleteOthers as two separate awaits today, with no transaction at all.
    - id: R2
      topic: ADR-0012 rule 5 boundary tests
      divergence: >-
        proposal.md listed both literal boundary tests as success criteria.
        design.md D15 showed they cannot be written in this change.
      resolution: >-
        DESIGN WINS; proposal restated. Verified: schema.ts holds only usuarios
        and sesiones, so there is no movimientos table for those tests to run
        against. The enforceable half — the no-quantity signature test — ships
        now; the two literal tests become a tracked obligation on #5/#6. #2.2
        does NOT stay open waiting for #5. The spec had already qualified this
        correctly; only the proposal was unconditional.

delivery_decision:
  decided_by: user
  decided: 2026-08-26
  forecast_lines: 720
  budget_lines: 400
  policy: four-chained-prs
  chain_strategy: stacked-to-main
  slices:
    - id: S1
      name: transaction seam
      lines: ~155
      note: pure refactor, no behaviour change, independently valuable
    - id: S2a
      name: table + field classification
      lines: ~145
      note: schema only, unreachable from any code path until S2b
    - id: S2b
      name: repository + service
      lines: ~270
      note: adds a service with no call site
    - id: S3
      name: changePassword reference implementation
      lines: ~150
      note: the only slice that changes observable API behaviour
  delivery_warning: >-
    VERIFIED THIS SESSION on the app-shell-login chain: GitHub does NOT
    auto-retarget a stacked PR when its base PR is merged. After merging PR #16,
    PR #17's base was still the merged branch, and still was 20 seconds later.
    Deleting a base branch while a dependent is open CLOSES the dependent.
    Procedure: `gh pr edit <n> --base main` on every dependent, confirm
    `base: main / MERGEABLE / CLEAN`, then merge and delete.
  merged_main_warning: >-
    ALSO VERIFIED: a clean merge is not a working merge. Every PR in the previous
    chain was MERGEABLE/CLEAN with green CI, and main still failed typecheck
    after merging, because two branches widened and consumed an interface without
    ever compiling each other's code. Run the full gate on the MERGED main before
    declaring the chain done — tests alone are not enough, since vitest does not
    typecheck.
