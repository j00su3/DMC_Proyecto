binding_adrs:
  - id: ADR-0011
    file: docs/adrs/0011-claves-primarias-uuid.md
    gives: >-
      uuid PKs with defaultRandom(); auditoria.entidad_id is uuid with NO foreign
      key (Postgres has no polymorphic FKs), deliberate so an audit row outlives
      its subject. sesiones.id staying text is the one documented exception.
  - id: ADR-0012
    file: docs/adrs/0012-frontera-auditoria-y-ledger.md
    gives: >-
      auditoria and movimientos stay separate; the decision test; no
      double-writing; a service signature with no quantity parameter; a
      sensitive-field denylist headed by hash_contrasena; two boundary tests;
      never name anything historial.

product_decisions:
  decided_by: user
  decided: 2026-08-26
  read_path: >-
    WRITE-ONLY in v1. No endpoint, no UI, no route file. Verified during
    exploration that no product document (PRD, design.md, TECH-DESIGNv2) asks for
    a read path over a record-change trail; every PRD audit requirement is
    movement-scoped. Recorded as an explicit non-goal, not an omission.
  auditable_actions: >-
    Creation, update, logical deletion and reactivation of usuarios/proveedores/
    productos, PLUS password change. Reads and failed logins are out of scope.
    The password-change case is not optional — apps/api/src/auth/service.ts:106
    already carries a comment naming #2.2 as its audit hook, and it is the exact
    non-repudiation case that puts #2.2 ahead of #3.
  atomicity: >-
    The audit write shares the database transaction with the business write. If
    the audit write fails, the business write rolls back. Rationale: a trail that
    can silently miss entries cannot distinguish "nobody did it" from "the write
    failed", which is the whole guarantee.
  retention: >-
    None in v1, unbounded. A single-store deployment produces few rows, and
    purging an audit trail is a decision better made against real volume.

