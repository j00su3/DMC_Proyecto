      that read. The hook now takes both from context via useRouter() and
      useQueryClient(), which removes the cycle and makes it testable in
      isolation. Note the design had already anticipated the sibling cycle
      (queryClient <-> router, solved with the late-bound setRouter) but this
      third edge was not foreseen.
