services:
  - type: web
    name: inventienda-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @inventienda/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Gates the cookie's Secure flag, the missing-secret hard failure, and
      # request logging (off everywhere else so the unit suite stays quiet).
      # Set LOG_LEVEL here or in the dashboard to raise/lower the level without
      # a redeploy; it defaults to "info".
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
