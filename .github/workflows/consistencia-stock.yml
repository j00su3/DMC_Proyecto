name: Consistencia de stock

on:
  schedule:
    - cron: '0 8 * * 0'

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.NEON_READONLY_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify stock consistency
        run: pnpm --filter @inventienda/api verificar:consistencia
