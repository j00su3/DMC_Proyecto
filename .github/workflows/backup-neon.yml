name: Backup semanal de Neon

# docs/DEPLOY-PLAN.md, "2026-09-04 -- Backup independiente (backlog #14, mitad B)". Neon's free
# tier only offers 6h of point-in-time recovery -- this workflow extends real coverage to 90 days
# via a weekly pg_dump uploaded as a GitHub Actions artifact. Reuses the SAME read-only Neon
# credential as consistencia-stock.yml (NEON_READONLY_DATABASE_URL) -- no new secret. Runs one hour
# after that workflow so both don't compete for the same connection.

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.NEON_READONLY_DATABASE_URL }}

    steps:
      # 2026-09-05: the first live run against Neon failed with "aborting
      # because of server version mismatch: server version 18.6; pg_dump
      # version 16.15" -- Neon's actual major version is 18, not 16 (unlike
      # local dev's docker-compose.yml, which still runs postgres:16-alpine).
      # pg_dump refuses to dump a NEWER server than itself by design. `set -o
      # pipefail` is load-bearing too: without it, `pg_dump | gzip` silently
      # produced a "successful" empty artifact when pg_dump failed, since
      # only gzip's exit code gated the step -- exactly what happened here.
      - name: Dump Neon database
        run: |
          set -o pipefail
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --no-owner --no-privileges' \
            | gzip > backup.sql.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 90
